<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claims Oversight Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a claims-review workstation. The incoming memo and the review form sit on the left, the printed quarter statement on the right.
   On phones it stacks memo, statement, form, with the confirm bar pinned to the bottom. */
:root{
  --paper:#edf1f0; --sheet:#fbfcfc; --well:#e3e9e7; --ink:#13222a; --ink-2:#52626b; --rule:#cfd8d5;
  --accent:#1e5d64; --accent-ink:#ffffff; --accent-soft:#d6e8e9;
  --stamp:#b0362b; --ok:#2a7550; --caution:#95600c;
  --ok-soft:#dbeee3; --caution-soft:#f4e6cc; --stamp-soft:#f5dcd8;
  --s1:#1e5d64; --s2:#c4661a; --s3:#8b989e;
  --shadow:0 1px 2px rgba(19,34,42,.06),0 4px 14px rgba(19,34,42,.05);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1417; --sheet:#162026; --well:#1e2a30; --ink:#e4ebed; --ink-2:#98a7ad; --rule:#2a373d;
    --accent:#6db3b9; --accent-ink:#0b1719; --accent-soft:#1c3438;
    --stamp:#ef7b6d; --ok:#6bc192; --caution:#e0a44a;
    --ok-soft:#183026; --caution-soft:#33281a; --stamp-soft:#3a201d;
    --s1:#6db3b9; --s2:#f0a25a; --s3:#7c8a91;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1417; --sheet:#162026; --well:#1e2a30; --ink:#e4ebed; --ink-2:#98a7ad; --rule:#2a373d;
  --accent:#6db3b9; --accent-ink:#0b1719; --accent-soft:#1c3438;
  --stamp:#ef7b6d; --ok:#6bc192; --caution:#e0a44a;
  --ok-soft:#183026; --caution-soft:#33281a; --stamp-soft:#3a201d;
  --s1:#6db3b9; --s2:#f0a25a; --s3:#7c8a91;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0;letter-spacing:-.005em}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:700}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)} .small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel>h2,.panel>h3{margin-bottom:10px}
.btn{font:600 .95rem/1 var(--f-body);border-radius:999px;padding:12px 20px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;transition:transform .12s ease,background .15s ease,opacity .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.lg{padding:15px 26px;font-size:1.02rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- intro ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:18px 26px}
.hero .lead{font-size:1.15rem;max-width:34em;margin:14px 0 22px;color:var(--ink)}
.factsheet{margin:0;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.factsheet .fs-head{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.factsheet dl{margin:0;padding:6px 16px 10px}
.factsheet dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--rule)}
.factsheet dl div:last-child{border-bottom:0}
.factsheet dt{color:var(--ink-2);font-size:.9rem}
.factsheet dd{margin:0;font-family:var(--f-mono);font-weight:500;text-align:right}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cols3 ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.startrow{display:flex;justify-content:center;padding-top:22px}

/* ---------- quarter header ---------- */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 .9rem var(--f-display);letter-spacing:.02em}
.brand b{display:block;font-family:var(--f-display);font-size:1.05rem}
.brand span{font-size:.8rem;color:var(--ink-2)}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.steps li{min-width:34px;padding:5px 0;text-align:center;border-radius:6px;font:500 .74rem var(--f-mono);color:var(--ink-2);background:var(--well)}
.steps li.done{background:var(--accent-soft);color:var(--accent)}
.steps li.now{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--sheet);border:1px solid var(--rule);font-size:.82rem;white-space:nowrap}
.chip b{font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--s3);flex:none}
.dot.t-good{background:var(--ok)} .dot.t-warn{background:var(--caution)} .dot.t-bad{background:var(--stamp)}

/* ---------- quarter layout ---------- */
.qgrid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);grid-template-areas:"ev rep" "lev rep";grid-template-rows:auto 1fr;gap:16px;align-items:start}
.qgrid .ev{grid-area:ev}.qgrid .rep{grid-area:rep}.qgrid .lev{grid-area:lev}

/* memo (event) */
.memo{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.memo-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 18px;background:var(--caution-soft);color:var(--caution);font:600 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase}
.memo-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.memo-body>p{max-width:62ch}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.choice{display:grid;gap:3px;text-align:left;width:100%;padding:13px 15px;border-radius:var(--r-sm);border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice b{font-weight:600}
.choice .d{font-size:.88rem;color:var(--ink-2)}
.cost{font:500 .78rem var(--f-mono);color:var(--accent)}
.outcome{background:var(--paper);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px}

/* impact list */
.impacts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.impacts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:11px 0;border-top:1px solid var(--rule)}
.impacts li:first-child{border-top:0;padding-top:4px}
.impacts .area{font-weight:600;font-size:.92rem}
.impacts .txt{grid-column:1/-1;font-size:.92rem;color:var(--ink-2)}
.impacts.mini li{padding:7px 0}
.pill{justify-self:end;font:600 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.t-good{background:var(--ok-soft);color:var(--ok)} .pill.t-warn{background:var(--caution-soft);color:var(--caution)} .pill.t-bad{background:var(--stamp-soft);color:var(--stamp)}
.notes{font-size:.88rem;color:var(--ink-2);margin:-4px 0 8px}

/* money ledger */
.ledger{width:100%;border-collapse:collapse;font-size:.9rem}
.ledger td{padding:6px 0;border-bottom:1px dashed var(--rule)}
.ledger td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.ledger tr.total td{border-bottom:0;border-top:2px solid var(--ink);font-weight:600;padding-top:9px}
.ledger tr.plan td{border-bottom:0;color:var(--ink-2)}
.pos{color:var(--ok)} .neg{color:var(--ink)}
.badge{display:inline-block;font:600 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.badge.t-good{background:var(--ok-soft);color:var(--ok)} .badge.t-bad{background:var(--stamp-soft);color:var(--stamp)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--paper);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.kpi .k{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.kpi .v{font:600 1.35rem var(--f-display);margin:2px 0}
.kpi .s{font-size:.78rem;color:var(--ink-2)}
.kpi .v.t-warn{color:var(--caution)} .kpi .v.t-bad{color:var(--stamp)} .kpi .v.t-good{color:var(--ok)}

/* charts */
.chart h3{margin-bottom:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--ink-2);margin:6px 0 6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
canvas{display:block;width:100%;height:180px}

/* levers */
.lev h2{margin-bottom:4px}
.notice{padding:10px 12px;border-radius:var(--r-sm);font-size:.9rem;background:var(--accent-soft);color:var(--ink);margin-top:10px}
.notice.bad{background:var(--stamp-soft)}
.lever,.ev{scroll-margin-top:16px}
.lever{border:0;margin:16px 0 0;padding:18px 0 0;box-shadow:inset 0 1px 0 var(--rule);min-width:0}
.lever legend{float:left;width:100%;padding-bottom:4px}
.lever legend+*{clear:both}
.lever legend{display:flex;align-items:center;gap:10px;padding:0;font:600 1.05rem var(--f-display)}
.lnum{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font:600 .74rem var(--f-mono);background:var(--well);color:var(--ink-2)}
.lever.done .lnum{background:var(--accent);color:var(--accent-ink)}
.help{font-size:.86rem;color:var(--ink-2);margin:6px 0 10px;max-width:62ch}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr);gap:2px 10px;align-content:start;padding:12px 13px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--sheet);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .radio{grid-row:1/span 3;width:18px;height:18px;margin-top:2px;border-radius:50%;border:2px solid var(--rule);background:var(--sheet);transition:border-color .15s,box-shadow .15s}
.opt .n{font-weight:600;font-size:.95rem}
.opt .d{font-size:.84rem;color:var(--ink-2)}
.opt .cost{margin-top:4px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:checked) .radio{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--sheet);background:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed}
.lastq{position:absolute;top:-8px;right:10px;font:600 .62rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--sheet);border:1px solid var(--accent);border-radius:999px;padding:1px 7px}

/* confirm bar */
.confirm{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);box-shadow:0 -6px 18px rgba(0,0,0,.06);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.confirm-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.progress{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--ink-2);min-width:0}
.linkbtn{border:0;background:none;padding:6px 0;font:inherit;color:var(--ink-2);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.pbar{width:90px;height:6px;border-radius:3px;background:var(--well);overflow:hidden;flex:none}
.pbar span{display:block;height:100%;background:var(--accent);transition:width .2s}

/* ---------- debrief ---------- */
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:22px;border-radius:var(--r);background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);margin-bottom:16px}
.verdict p{margin-top:8px;max-width:60ch}
.scorebox{text-align:center;position:relative;padding:6px 10px}
.scorebox .big{display:block;font:700 4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.scorebox .of{font-size:.82rem;color:var(--ink-2)}
.stamp{display:inline-block;transform:rotate(-6deg);border:3px solid currentColor;border-radius:6px;padding:3px 10px;font:700 .95rem var(--f-mono);letter-spacing:.14em;margin-bottom:8px}
.stamp.lost{color:var(--stamp)} .stamp.won{color:var(--ok)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.dgrid.full{grid-template-columns:minmax(0,1fr)}
.society{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.society b{font-weight:600}
.news{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.news li{padding:10px 12px;border-radius:var(--r-sm);background:var(--paper);font:600 .98rem/1.3 var(--f-display)}
.news li span{display:block;font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:3px}
.score-row{display:grid;grid-template-columns:minmax(0,1fr) 52px 52px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.score-row:last-child{border-bottom:0}
.score-row .lbl b{display:block;font-weight:600;font-size:.92rem}
.score-row .lbl span{font-size:.8rem;color:var(--ink-2)}
.score-row .val{text-align:right;font:600 1rem var(--f-mono)}
.score-row .val.ref{color:var(--ink-2);font-weight:400}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--well);position:relative;overflow:hidden}
.meter span{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.meter i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-2)}
.score-head{display:grid;grid-template-columns:minmax(0,1fr) 52px 52px;gap:10px;font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.score-head span{text-align:right}
.narr{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px;max-width:80ch}
.tablewrap{overflow-x:auto}
table.log{border-collapse:collapse;width:100%;font-size:.86rem;min-width:720px}
table.log th,table.log td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
table.log th{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tag{display:inline-block;font:600 .68rem var(--f-mono);border-radius:4px;padding:0 5px;background:var(--well)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
details summary{cursor:pointer;font-weight:600}
footer{font-size:.8rem;color:var(--ink-2);border-top:1px solid var(--rule);margin-top:28px;padding-top:14px;display:flex;flex-direction:column;gap:8px}
footer ol{padding-left:20px;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}

@media (max-width: 860px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .cols3{grid-template-columns:minmax(0,1fr)}
  .qgrid{grid-template-columns:minmax(0,1fr);grid-template-areas:"ev" "rep" "lev";grid-template-rows:auto}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .verdict{grid-template-columns:minmax(0,1fr)}
  .scorebox{text-align:left}
}
@media (max-width: 520px){
  body{font-size:14.5px}
  .panel{padding:15px}
  .steps li{min-width:0;flex:1}
  .steps{width:100%}
  .opts{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pbar{display:none}
  .confirm .btn{padding:12px 16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <main id="app"></main>
  <footer id="footer"></footer>
</div>
<div class="confirm" id="confirm" hidden></div>
<script>
"use strict";
/* =====================================================================
   CLAIMS OVERSIGHT SIMULATOR — single-file learning simulation
   Tag legend for every number:  [S] sourced  [D] derived  [E] pedagogical estimate
   Source keys (S1..S11) refer to the SOURCES table below.
   ===================================================================== */

/* ---------- 1. PARAMETERS (tunable) ---------- */
const P = {
  quarters: 8,                 // [E] 2 simulated years
  members: 500000,             // [E] mid-size Medicare Advantage plan (fictional)
  baseVolume: 200000,          // [D] 500k members x ~1.6 prior-auth requests/member/yr / 4  (S1: 49.8M determinations, ~31M MA enrollees)
  highRiskShare: 0.35,         // [E] share of denials in post-acute, oncology, behavioral health
  costAvoidedPerDenial: 1500,  // [E] avg medical cost not paid when a request is denied
  appealIfWrong: 0.30,         // [E] tuned so overall appeal rate is ~10-12% (S1: 11.7%)
  appealIfRight: 0.09,         // [E]
  overturnIfWrong: 0.95,       // [E] anchored to S1: 81.7% of appealed MA denials overturned
  overturnIfRight: 0.40,       // [E]
  appealAdminCost: 400,        // [E] $ per appeal handled
  reviewerCostQ: 30000,        // [D] S9 RN median $86,070/yr x ~1.4 loaded / 4
  contractorCostQ: 45000,      // [E]
  reviewerHoursQ: 420,         // [E] ~520 paid hrs/quarter x ~80% productive
  startReviewers: 14,          // [E]
  maxHirePerQ: 10,             // [E] clinical reviewers are slow to recruit
  hireCost: 12000,             // [E]
  severance: 15000,            // [E]
  catchMax: 0.92,              // [E] best-case share of wrong denials a reviewer catches
  catchTau: 6,                 // [E] minutes; p(catch)=catchMax*(1-exp(-min/tau)). At 1.2 s (S3) p~0
  complacencyWeight: 0.6,      // [E] automation bias, qualitative basis S10/S11
  falseOverturn: 0.03,         // [E] reviewers wrongly overturn correct denials
  auditMinPerCase: 20,         // [E]
  auditCorrectionPerCase: 0.000015, // [E] audit labels fed back into model retraining
  baseDriftQ: 0.01,            // [E] silent model drift per quarter with no feedback
  vendorDrift: 0.08,           // [E] error added by unvalidated vendor update
  marginPerMemberQ: 150,       // [E] premium margin lost per departed member per quarter
  planBase: 17.5e6,            // [E] board plan for claims-ops net result, quarter 1
  planGrowth: 0.015,           // [E] plan rises 1.5% per quarter
  boardSensitivity: 30,        // [E]
  turnaroundStd: 7,            // [S] S6: 7 calendar days for standard prior-auth decisions
  surgeFactor: 1.4,            // [E]

/* ---------- 4. ENGINE ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(rng){let u=0,v=0;while(!u)u=rng();while(!v)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

function newState(seed){
  return {
    seed, rng: mulberry32(seed), q: 1,
    heads: P.startReviewers, morale: 70, compl: 0.2, drift: 0, vDrift: 0, E: 0.5,
    board: 60, reg: 70, prov: 65, mem: 65, lostMembers: 0,
    flags: {}, recurring: 0, qCost: 0, eventCost: 0, cumHighEsc: 0,
    history: [], log: [], over: null, lawQ: null
  };
}
function spend(S, amt){ S.qCost += amt; S.eventCost += amt; }
function lastH(S){ return S.history[S.history.length-1]; }

function regulatorOutcome(S, mode){
  const h = lastH(S); const s = h.escRate;
  const auditDoc = S.history.slice(-2).some(x => x.audit);
  let fine = clamp((s - 0.04) * 60, 0, 12) * 1e6, hit = Math.max(0, (s - 0.04) * 200);
  if (mode === "open") {
    const k = auditDoc ? 0.5 : 1; fine *= k; hit *= k;
    spend(S, fine); S.reg += 5 - hit;
    if (s < 0.05) { S.reg += 8; S._headline = "State inspection finds insurer's AI checks working";
      return out("A clean result. The state praises your quality checks.", ["Politics", "Officials hold you up as a good example."]); }
    S._headline = "State fines insurer over wrongful denials";
    return out(`The inspectors found problems and gave you a ${fineWord(fine)} of ${money(fine)}.`,
      auditDoc ? ["Politics", "Your spot checks showed good faith, so the penalty was cut in half."] : ["Politics", "The findings are now public record."],
      ["Patients", "The state orders you to re-check some denied cases."]);
  }
  if (s > 0.08) { fine *= 1.6; spend(S, fine); S.reg -= hit * 1.3 + 10; S.board -= 5; S._headline = "State hits uncooperative insurer with penalty";
    return out(`The inspectors got suspicious and dug deeper. You got a ${fineWord(fine)} of ${money(fine)} and must follow a correction plan.`, ["Politics", "Officials now see you as uncooperative."], ["Public", "The news reports on the penalty."]); }
  S.reg -= 2; S.board += 2;
  return out("The inspection closed with minor issues.", ["Politics", "Officials noticed that you shared only the bare minimum."]);
}

function drawEvent(S){
  if (S.q === 3) return { id: "surge", why: "Planned: flu season and a new employer." };
  if (S.q === 4) return { id: "vendor", why: "Planned: the AI company's release schedule." };
  if (S.q === 6) return { id: "law", why: "Planned: based on real 2024 laws (S8)." };
  if (S.q < 2) return null;
  const h = lastH(S), f = S.flags, c = [];
  const mDrivers = [];
  if (S.E > 4) mDrivers.push("many wrongly denied patients were telling their stories");
  if (h.m != null && h.m < 3) mDrivers.push(`reviewers had only ${fmtMin(h.m)} per case`);
  if (h.m == null) mDrivers.push("no person was checking AI denials");
  if (f.paper && S.lawQ && S.q >= S.lawQ) mDrivers.push("batch sign-offs had become routine");
  if (!f.classDone && S.cumHighEsc > 4000)
    c.push(["classAction", 0.3 + (f.mediaHit ? 0.2 : 0), `Thousands of patients had been wrongly refused serious care.`]);
  c.push(["regulator", Math.min(0.6, 0.03 + 0.025 * S.E + (h.overturnRate > 0.7 ? 0.08 : 0) + (f.mediaHit ? 0.2 : 0)),
    `Inspections get more likely when many appeals are won by patients${f.mediaHit ? " and after news stories" : ""}.`]);
  if ((f.mediaN || 0) < 2)
    c.push(["media", Math.min(0.7, 0.02 + 0.03 * S.E + ((h.m != null && h.m < 3) || h.m == null ? 0.25 : 0) + (f.paper && S.lawQ && S.q >= S.lawQ ? 0.25 : 0)),
      mDrivers.length ? "It became more likely because " + mDrivers.join(" and ") + "." : "Insurers' denials draw news attention from time to time."]);
  if (!f.providerDone && S.prov < 45) c.push(["provider", 0.45, "Doctors and hospitals had lost trust in your decisions."]);
  if (S.morale < 45 && (f.burnoutQ || -9) < S.q - 2) c.push(["burnout", 0.45, "Your team was overworked and under time pressure."]);
  if (!f.boardDone && S.board < 45) c.push(["boardPush", 0.5, "Your results had come in below the board's plan."]);
  for (const [id, p, why] of c) if (S.rng() < p) return { id, why };
  return null;
}

function fireEvent(S, ev){
  const E = EVENTS[ev.id];
  if (E.onFire) E.onFire(S);
  const f = S.flags;
  if (ev.id === "media") f.mediaN = (f.mediaN || 0) + 1;
  if (ev.id === "classAction") f.classDone = true;
  if (ev.id === "provider") f.providerDone = true;
  if (ev.id === "burnout") f.burnoutQ = S.q;
  if (ev.id === "boardPush") f.boardDone = true;
}
function resolveEvent(S, ev, idx){
  const before = S.eventCost;
  S._headline = null;
  const msg = EVENTS[ev.id].choices[idx].apply(S);
  S.log.push({ q: S.q, id: ev.id, why: ev.why, choice: idx, label: EVENTS[ev.id].choices[idx].label, outcome: msg, headline: S._headline, cost: S.eventCost - before });
  clampStake(S);

}

function computeScores(S){
  const H = S.history, n = H.length || 1, sum = f => H.reduce((a, h) => a + f(h), 0);

  const avgMorale = sum(h => h.morale) / n;
  const d = {
    fin:  clamp((ratio - 0.6) / 0.6 * 100, 0, 100),
    acc:  clamp(100 - escRate * 400, 0, 100),
    harm: (clamp(100 - harm / 80, 0, 100) + S.mem) / 2,   // patient harm + public trust
    reg:  S.reg, prov: S.prov,
    work: clamp((avgMorale + S.morale) / 2, 0, 100)
  };
  const raw = (d.fin + d.acc + d.harm + d.reg + d.prov + d.work) / 6;
  // Removal penalty [E]: score scaled by share of the run completed (25% floor)

  if (curEvent) {
    const E = EVENTS[curEvent.id];
    html += `<section class="ev"><article class="memo"><div class="memo-head"><span>${E.kicker}</span><span>Q${S.q}</span></div><div class="memo-body"><h2>${E.title}</h2><p>${E.text(S)}</p>`;
    if (!eventDone) html += `<div class="choices">` + E.choices.map((c, i) => `<button class="choice" data-choice="${i}"><b>${c.label}</b><span class="d">${c.desc}</span><span class="cost">${bandOf(c.band, S)}</span></button>`).join("") + `</div>`;
    else html += `<div class="outcome"><p class="small muted">You chose: <b style="color:var(--ink)">${esc(S.log[S.log.length - 1].label)}</b></p>${eventMsg}</div>`;
    html += `</div></article></section>`;
  }
  html += `<section class="rep stack">`;
  if (!h) {
    html += `<div class="panel"><h2>Where you start</h2><p style="margin-top:8px">Last year the company had a person check every AI denial, with about 10 minutes per case. There was no training program and no spot checks.</p>
      <p class="small muted" style="margin-top:10px">The board expects about ${money(P.planBase)} in net savings per quarter, and it raises that target 1.5% every quarter.</p></div>`;
  } else {
    const tmin = LEVERS.target.options[h.policy.target].min;
    html += `<div class="panel"><h2>What happened in Q${h.q}</h2>${lastNotes ? `<p class="notes" style="margin-top:8px">${lastNotes}</p>` : ""}<ul class="impacts" style="margin-top:8px">${impacts(S, h)}</ul></div>
      <div class="panel"><h3>Money in Q${h.q}</h3>${ledger(h)}</div>
      <div class="panel"><h3>Operations in Q${h.q}</h3><div class="kpis" style="margin-top:10px">
        ${kpi("Time per case", h.m == null ? "No review" : fmtMin(h.m), h.m != null && h.m < tmin ? "Rushed: less than planned" : "As planned", h.m != null && h.m < tmin ? "warn" : "")}
        ${kpi("Reviewers", String(Math.round(h.heads)), `About ${Math.round(Math.min(h.rho, 1.5) * 100)}% busy`, h.rho > 0.9 ? "bad" : h.rho > 0.8 ? "warn" : "")}
        ${kpi("AI mistakes found", pct(h.reportedErr), "Only mistakes someone caught")}
        ${kpi("Spot-check result", h.audit ? pct(h.audit.est) : "No data", h.audit ? "Estimated share of final denials that were wrong" : "Turn on spot checks to see this")}
      </div></div>`;
    html += chartBlock("c1", "Net savings vs. the board's plan ($M)", [["--s1", "Your result"], ["--s3", "Board's plan", 1]]);
    html += chartBlock("c2", "How often is the AI wrong? (%)", [["--s2", "AI mistakes found"], ["--s1", "Spot-check estimate"]], "\"Mistakes found\" only counts what someone caught. Spot checks estimate the real number.");
  }
  html += `</section><section class="lev panel"><h2>Your Q${S.q} decisions</h2><p class="small muted">Read each option and choose one in each of the 6 sections.</p>`;
  if (S.flags.forceAll) html += `<div class="notice">Because of the lawsuit settlement, a person must check every AI denial.</div>`;
  if (lawOn && !S.flags.paper) html += `<div class="notice bad">The new state law is in effect: a person must check every AI denial. Breaking it costs a $3M fine every quarter.</div>`;
  if (lawOn && S.flags.paper) html += `<div class="notice">Batch sign-off is in effect: one medical director approves AI denials in bulk.</div>`;
  if (S.flags.quotaPauseQ === S.q) html += `<div class="notice">Time targets are paused this quarter, so reviewers take the time they need.</div>`;
  LEVER_KEYS.forEach((key, idx) => {
    const lv = LEVERS[key];
    html += `<fieldset class="lever ${pol[key] ? "done" : ""}" data-lever="${key}"><legend><span class="lnum">${idx + 1}</span>${lv.label}</legend><p class="help">${lv.help}</p><div class="opts">` + Object.entries(lv.options).map(([v, o]) => {
      const dis = !eventDone || (key === "review" && S.flags.forceAll && v !== "all");
      const was = prevPol && prevPol[key] === v ? `<span class="lastq">Last quarter</span>` : "";
      return `<label class="opt">${was}<input type="radio" id="${key}-${v}" name="${key}" value="${v}" ${pol[key] === v ? "checked" : ""} ${dis ? "disabled" : ""}><span class="radio"></span><span class="n">${o.name}</span><span class="d">${o.desc}</span><span class="cost">${o.band}</span></label>`;
    }).join("") + `</div></fieldset>`;
  });
  const heads = Math.round(S.heads);
  html += `<fieldset class="lever ${pol.hire !== null ? "done" : ""}" data-lever="hire"><legend><span class="lnum">6</span>Change your team size?</legend><p class="help">You have ${heads} reviewers. Each costs $30K a quarter. New hires cost $12K each and start next quarter. Layoffs happen right away and cost $15K each in severance.</p><div class="opts">` +
    HIRE_CHOICES.map(n => {
      const dis = !eventDone || (n < 0 && heads + n < 1);
      const was = prevPol && prevPol.hire === n ? `<span class="lastq">Last quarter</span>` : "";
      const name = n < 0 ? `Lay off ${-n}` : n > 0 ? `Hire ${n}` : "Keep the team as is";
      const desc = n < 0 ? `Go down to ${heads + n} reviewers now.` : n > 0 ? `Grow to ${heads + n} reviewers next quarter.` : `Stay at ${heads} reviewers.`;
      const cost = n < 0 ? `${money(-n * P.severance)} now · saves ${money(-n * P.reviewerCostQ)} a quarter` : n > 0 ? `${money(n * P.hireCost)} now · ${money(n * P.reviewerCostQ)} more a quarter` : "$0";
      return `<label class="opt">${was}<input type="radio" id="hire-${n}" name="hire" value="${n}" ${pol.hire === n ? "checked" : ""} ${dis ? "disabled" : ""}><span class="radio"></span><span class="n">${name}</span><span class="d">${desc}</span><span class="cost">${cost}</span></label>`;
    }).join("") + `</div></fieldset>`;
  html += `</section></div>`;
  app.innerHTML = html;
  bar.hidden = false;
  bar.innerHTML = `<div class="confirm-in"><div class="progress"><span class="pbar"><span id="pfill"></span></span><button type="button" class="linkbtn" id="pickNote"></button></div><button class="btn primary" id="commit">Confirm Q${S.q}</button></div>`;
  bindQuarter(); refreshReady();
  if (h) drawPlayCharts();
}
function kpi(k, v, s, cls = ""){ return `<div class="kpi"><div class="k">${k}</div><div class="v ${cls ? "t-" + cls : ""}">${v}</div><div class="s">${s}</div></div>`; }
function pickNote(){
  if (!eventDone) return "Respond to the surprise first";
    return nChosen() < 6 ? `${nChosen()} of 6 chosen · go to next ↓` : "All set";
}
function drawPlayCharts(){
  const H = S.history, pad = a => a.concat(Array(Math.max(0, P.quarters - a.length)).fill(null));
  drawChart(document.getElementById("c1"), [
    { data: pad(H.map(h => h.profit / 1e6)), color: "--s1", fill: 1 }, { data: Array.from({ length: P.quarters }, (_, i) => P.planBase * Math.pow(1 + P.planGrowth, i) / 1e6), color: "--s3", dash: 1 }]);
  drawChart(document.getElementById("c2"), [
    { data: pad(H.map(h => h.reportedErr * 100)), color: "--s2" },
    { data: pad(H.map(h => h.audit ? h.audit.est * 100 : null)), err: pad(H.map(h => h.audit ? h.audit.ci * 100 : null)), color: "--s1" }]);
}
function refreshReady(){
  const c = document.getElementById("commit"); if (!c) return;
  c.disabled = !ready();
  document.getElementById("pickNote").textContent = pickNote();
  document.getElementById("pfill").style.width = (nChosen() / 6 * 100) + "%";
  app.querySelectorAll("[data-lever]").forEach(f => f.classList.toggle("done", pol[f.dataset.lever] != null));
}
function bindQuarter(){
  app.querySelectorAll("[data-choice]").forEach(b => b.onclick = () => {
    eventMsg = resolveEvent(S, curEvent, +b.dataset.choice); eventDone = true;
    if (S.flags.forceAll) pol.review = "all";
    renderQuarter();
  });
  app.querySelectorAll("input[type=radio]").forEach(r => r.onchange = () => { pol[r.name] = r.name === "hire" ? +r.value : r.value; refreshReady(); });
  document.getElementById("pickNote").onclick = () => {
    const target = !eventDone ? app.querySelector(".ev") : app.querySelector("[data-lever]:not(.done)") || document.getElementById("commit");
    if (target && target.scrollIntoView) target.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  document.getElementById("commit").onclick = () => {
    if (!ready()) return;
    prevPol = { ...pol };
    const h = simulateQuarter(S, { ...pol });
    const bits = [];
    if (h.laid) bits.push(`${h.laid} reviewers were laid off.`);
    if (h.quit >= 0.5) bits.push(`About ${Math.round(h.quit)} reviewer${Math.round(h.quit) > 1 ? "s" : ""} quit.`);
    if (h.hires) bits.push(`${h.hires} new reviewer${h.hires > 1 ? "s" : ""} start next quarter.`);
    if (h.q === 4) bits.push("Yearly sign-up season ended. Some members switched insurers based on how you treated them.");
    lastNotes = bits.join(" ");
    window.scrollTo(0, 0);
    if (S.over || S.q > P.quarters) renderDebrief(); else beginQuarter();
  };
}

/* ---- Debrief ---- */
function narrative(S, R, sc, rsc){
  const H = S.history, out = [];
  let gq = null, gap = 0; H.forEach(h => { const g = h.wrongShare - h.reportedErr; if (g > gap) { gap = g; gq = h; } });
  if (gq && gap > 0.06) out.push(`<b>Your screen looked better than reality.</b> In Q${gq.q} your screen said the AI got ${pct(gq.reportedErr)} of its denials wrong. The real number was <b>${pct(gq.wrongShare)}</b>. A mistake only counts as "found" when someone looks. ${gq.reviewed < 1 ? "No one was looking." : "Your reviewers were missing most of them."} Less checking made the number look better, not worse.`);
  const fast = H.filter(h => h.m != null && h.m < 3);
  if (fast.length) { const w = fast.reduce((a, b) => b.m < a.m ? b : a);
    out.push(`<b>Checking turned into rubber-stamping.</b> In Q${w.q} reviewers had only ${fmtMin(w.m)} per case. At that speed a person can't really read a medical file, so most wrong denials went straight to patients. A 2023 news investigation (S3) reported insurance doctors spending about 1.2 seconds per case.`); }
  const vc = S.flags.vendorChoice;
  if (vc === "accept") { const a = H.filter(h => h.q >= 4 && h.audit);
    out.push(a.length ? `<b>Spot checks caught a hidden problem.</b> The new AI version quietly made more mistakes. Your spot checks were the only thing that could see it, and they also helped retrain the AI.`
      : `<b>A hidden problem went unnoticed.</b> The new AI version you accepted quietly made more mistakes. With no spot checks, nothing on your screen could show it.`); }
  else if (vc === "shadow") out.push(`<b>Testing the new AI first paid off.</b> For $300K you caught most of its new mistakes before patients felt them.`);
  if (Math.max(...H.map(h => h.compl)) > 0.5) out.push(`<b>Your team started trusting the AI too much.</b> Under time pressure and without training, people stop questioning a machine that is usually right. Psychologists call this automation bias (S10).`);
  const hot = H.filter(h => h.rho > 0.9).length;
  if (hot >= 2) out.push(`<b>Overwork made itself worse.</b> Your team was overloaded for ${hot} quarters. Tired people quit, and every person who left added more work for those who stayed.`);
  if (S.lawQ) { const nc = H.filter(x => x.nonCompliant).length;
    if (nc) out.push(`<b>Earlier choices came back.</b> When the new law required human review, you didn't have enough reviewers, and new hires take a quarter to start. You paid ${money(nc * 3e6)} in fines and lost political standing.`);
    if (S.flags.paper) out.push(`<b>Following the law "on paper" changed nothing for patients.</b> One person signing hundreds of cases is still a rubber stamp, and it raised your risk of a news scandal.`); }
  const early = H.filter(h => h.q <= 4).reduce((a, h) => a + h.profit - h.plan, 0);
  if (early > 3e6 && S.eventCost > 5e6) out.push(`<b>Early savings came back as later costs.</b> You beat the plan by ${money(early)} in year 1. Later, fines, lawsuits and clean-up cost ${money(S.eventCost)}.`);
  if (H.filter(h => h.audit).length >= 4) out.push(`<b>You measured what mattered.</b> Spot checks were the only number that didn't look better when checking got worse.`);
  out.push(`<b>A strong path from the same start</b> scored <b>${rsc.d.overall.toFixed(0)}</b> (yours: <b>${sc.d.overall.toFixed(0)}</b>). It used a normal AI setting, had a person check every AI denial with plenty of time per case, paid for practice and rotation, ran large spot checks, hired before the busy season, and chose the long-term fix for each surprise.`);
  return out;
}
function society(S){
  const H = S.history, tot = H.reduce((a, h) => a + h.escWrong, 0), ser = H.reduce((a, h) => a + h.escH, 0);
  return [
    `<b>Patients:</b> about <b>${fmtRound(tot)}</b> people were wrongly refused care they needed. About <b>${fmtRound(ser)}</b> of them needed serious care, such as a nursing home after a hospital stay, cancer treatment, or mental-health care. Some appealed and won. Many gave up.`,
    `<b>Public trust:</b> ${S.mem >= 60 ? "people still see your company as fair." : S.mem >= 40 ? "trust in your company has slipped." : "your company has become a symbol of \"AI denying care\" in the news and online."}${S.lostMembers > 0 ? ` About ${fmtRound(S.lostMembers)} members left for other insurers.` : ""}`,
    `<b>Politics:</b> ${S.reg >= 60 ? "officials see you as a model for responsible AI use." : S.reg >= 40 ? "officials are cautious about you." : "lawmakers point to your company when they argue for tougher AI rules."}${S.flags.lawChoice === "contest" ? " You also lobbied against a patient-protection law." : ""}`,
    `<b>Doctors & hospitals:</b> ${S.prov >= 60 ? "doctors trust your decisions." : S.prov >= 40 ? "doctors are frustrated with you." : "doctors see you as an obstacle to their patients' care."}`,
    `<b>Your staff:</b> ${S.morale >= 60 ? "your team is proud of its work." : S.morale >= 40 ? "your team is tired." : "your team is burned out, and many have left."}`
  ];
}
function fmtRound(x){ return x >= 1000 ? (Math.round(x / 100) * 100).toLocaleString("en-US") : Math.round(x).toLocaleString("en-US"); }
function totals(X){
  const H = X.history, s = f => H.reduce((a, h) => a + f(h), 0);
  return { saved: s(h => h.avoided), staff: s(h => h.br.reviewers + h.br.extra + h.br.training + h.br.staffChange), other: s(h => h.br.appeals + h.br.vendor + h.br.lostMembers),
    fines: s(h => h.br.events + h.br.fines), net: s(h => h.profit), plan: s(h => h.plan) };
}

function renderDebrief(){
  bar.hidden = true;
  const R = runReference(S.seed), sc = computeScores(S), rsc = computeScores(R);
  const lost = !!S.over, T = totals(S), RT = totals(R);
  const why = lost ? (S.over.type === "board" ? "The board removed you because results stayed too far below its plan." : "The state government ordered your company to remove you.") : "You made it through all 8 quarters.";
  const news = S.log.filter(l => l.headline);
  let html = `<section class="verdict"><div><p class="eyebrow">Debrief · ${CO}</p><h1 style="margin-top:8px">${lost ? "Removed in Q" + S.over.q : "Two years complete"}</h1><p>${why} All six areas count equally.${lost ? " Being removed early lowers your score." : ""}</p></div>
    <div class="scorebox"><span class="stamp ${lost ? "lost" : "won"}">${lost ? "REMOVED" : "COMPLETE"}</span><span class="big">${sc.d.overall.toFixed(0)}</span><span class="of">out of 100 · strong path ${rsc.d.overall.toFixed(0)}</span></div></section>`;
  html += `<div class="dgrid"><div class="panel"><h2>Your impact</h2><ul class="society" style="margin-top:10px">${society(S).map(x => `<li>${x}</li>`).join("")}</ul>
    ${news.length ? `<h3 style="margin-top:18px">In the news</h3><ul class="news">${news.map(l => `<li><span>Q${l.q}</span>${esc(l.headline)}</li>`).join("")}</ul>` : ""}</div>
    <div class="stack"><div class="panel"><h2>Scorecard</h2><div class="score-head" style="margin-top:10px"><span style="text-align:left">Area</span><span>You</span><span>Strong</span></div>` +
    DIMS.map(([k, n, d]) => `<div class="score-row"><div class="lbl"><b>${n}</b><span>${d}</span></div><div class="val">${sc.d[k].toFixed(0)}</div><div class="val ref">${rsc.d[k].toFixed(0)}</div><div class="meter"><span style="width:${sc.d[k]}%"></span><i style="left:${rsc.d[k]}%"></i></div></div>`).join("") +
    `<p class="small muted" style="margin-top:8px">The bar is your score. The thin line marks the strong path.</p></div>
    <div class="panel"><h2>Two years of money</h2><table class="ledger" style="margin-top:8px"><tr><td></td><td class="muted">You</td><td class="muted">Strong path</td></tr>
      ${[["Savings from denials", T.saved, RT.saved], ["Staff, training & hiring", -T.staff, -RT.staff], ["Appeals, vendor & lost members", -T.other, -RT.other], ["Fines, lawsuits & one-time costs", -T.fines, -RT.fines]]
        .map(([l, a, b]) => `<tr><td>${l}</td><td>${money(a)}</td><td>${money(b)}</td></tr>`).join("")}
      <tr class="total"><td>Net result</td><td>${money(T.net)}</td><td>${money(RT.net)}</td></tr>
      <tr class="plan"><td>Board's plan${lost ? " (quarters played)" : ""}</td><td>${money(T.plan)}</td><td>${money(RT.plan)}</td></tr></table></div></div></div>`;
  html += `<div class="panel" style="margin-bottom:16px"><h2>Why it turned out this way</h2><ul class="narr" style="margin-top:10px">${narrative(S, R, sc, rsc).map(x => `<li>${x}</li>`).join("")}</ul></div>`;
  html += `<div class="dgrid">${chartBlock("d1", "What your screen showed vs. the truth (%)", [["--s2", "AI mistakes found (your screen)"], ["--stamp", "Real AI mistake rate"], ["--s3", "Real rate, strong path", 1]])}
    ${chartBlock("d2", "Patients wrongly refused care (thousands)", [["--stamp", "You"], ["--s3", "Strong path", 1]])}</div>`;
  html += `<div class="panel" style="margin-bottom:16px"><h2>Your decisions and surprises</h2><div class="tablewrap" style="margin-top:8px"><table class="log"><tr><th>Q</th><th>AI</th><th>Human check</th><th>Time</th><th>Training</th><th>Spot checks</th><th>Surprise → your response</th></tr>` +
    S.history.map(h => { const ev = S.log.find(l => l.q === h.q); const p = h.policy;
      return `<tr><td class="mono">${h.q}</td><td>${LEVERS.ai.options[p.ai].name}</td><td>${LEVERS.review.options[h.effReview].name}${h.paper ? " (batch sign-off)" : ""}</td><td>${LEVERS.target.options[p.target].name}</td><td>${LEVERS.training.options[p.training].name}</td><td>${LEVERS.audit.options[p.audit].name}</td>
      <td>${ev ? `<b>${EVENTS[ev.id].title}</b> → ${esc(ev.label)}<div class="small muted">Why it happened: ${esc(ev.why)}</div>` : "—"}</td></tr>`; }).join("") + `</table></div></div>`;
  html += `<div class="panel" style="margin-bottom:16px"><h2>Talk about it</h2><ol class="narr" style="margin-top:10px">
    <li>Which number on your screen did you trust most? When did it stop telling the truth?</li>
    <li>The AI was the same for everyone. What really decided how many patients were hurt: the AI, or the people and rules around it?</li>
    <li>Pick one surprise. How did the cheap fix and the long-term fix play out for patients, politics and your staff?</li>
    <li>If you were designing this system as an engineer, where would you add a warning light, a feedback loop, or a safety margin?</li></ol></div>`;
  html += `<div class="panel" style="margin-bottom:16px"><details><summary>Where the numbers come from</summary><p class="small muted" style="margin:8px 0">Each number in the code is labeled as from a source (S), calculated from sources (D), or a teaching estimate (E).</p><div class="tablewrap"><table class="log" style="min-width:0">
    <tr><th>What</th><th>Value</th><th>Type</th></tr>
    <tr><td>Pre-approval requests per quarter</td><td class="mono">${fmtInt(P.baseVolume)}</td><td><span class="tag">D</span> S1</td></tr>
    <tr><td>Share the AI wants to deny (normal setting)</td><td class="mono">8%</td><td><span class="tag">E</span> based on S1 (6.4%)</td></tr>
    <tr><td>Share of AI denials that are wrong (normal)</td><td class="mono">18%</td><td><span class="tag">E</span> based on S2 (13%)</td></tr>
    <tr><td>Appeals that patients win</td><td class="mono">81.7%</td><td><span class="tag">S</span> S1</td></tr>
    <tr><td>Reviewer cost per quarter</td><td class="mono">${money(P.reviewerCostQ)}</td><td><span class="tag">D</span> S9</td></tr>
    <tr><td>Medical spending saved per denial</td><td class="mono">$1,500</td><td><span class="tag">E</span></td></tr>
    <tr><td>Chance of catching a mistake vs. time per case</td><td>falls fast below ~5 min</td><td><span class="tag">E</span> based on S3, S11</td></tr>
    <tr><td>Decision deadline</td><td class="mono">${P.turnaroundStd} days</td><td><span class="tag">S</span> S6</td></tr>
    <tr><td>Fines, lawsuits, public and political reactions</td><td>various</td><td><span class="tag">E</span></td></tr>
  </table></div></details></div>`;
  html += `<div class="actions"><button class="btn primary lg" id="again">Play again</button><button class="btn lg" id="same">Replay with the same surprises</button></div>`;
  app.innerHTML = html;
  const pad = a => a.concat(Array(Math.max(0, P.quarters - a.length)).fill(null));
  drawChart(document.getElementById("d1"), [
    { data: pad(S.history.map(h => h.reportedErr * 100)), color: "--s2" },
    { data: pad(S.history.map(h => h.wrongShare * 100)), color: "--stamp", fill: 1 },
    { data: pad(R.history.map(h => h.wrongShare * 100)), color: "--s3", dash: 1 }]);
  drawChart(document.getElementById("d2"), [
    { data: pad(S.history.map(h => h.escWrong / 1000)), color: "--stamp", fill: 1 },
    { data: pad(R.history.map(h => h.escWrong / 1000)), color: "--s3", dash: 1 }]);
  document.getElementById("again").onclick = () => startGame(newSeed());
  document.getElementById("same").onclick = () => startGame(S.seed);
  window._redraw = () => renderDebrief();
}

document.getElementById("footer").innerHTML = `<p><b>For teaching only.</b> ${CO} is made up. The numbers are simplified estimates chosen to show how the system behaves. They are not predictions and do not describe any real company. Lawsuits and news reports cited below involve claims and reporting, not court findings, unless stated.</p>
<details><summary>Sources</summary><ol>${SOURCES.map(([k, t]) => `<li><b>${k}</b> ${esc(t)}</li>`).join("")}</ol></details>`;
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (S && document.getElementById("c1")) drawPlayCharts(); }, 150); });
renderIntro();
})();
</script>
</body>
</html>
